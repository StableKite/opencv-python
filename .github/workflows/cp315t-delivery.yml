name: CPython 3.15t ordinary dependency delivery
on:
  push:
    branches: [5.x]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary-pip-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.15t
      - name: Ordinary pip from default branch
        working-directory: ${{ runner.temp }}
        run: python -m pip install "opencv-python @ git+https://github.com/StableKite/opencv-python.git"
      - name: Retained original wheel, all installed bytes, real SDK and natural GIL
        run: python .github/scripts/cp315t_provenance.py binary_wheels.json provenance.json --expected-commit "${{ github.sha }}"
      - name: Real video codecs and eight native threads, natural GIL
        run: python .github/scripts/cp315t_video_contract.py
      - name: Actual native text and eight native threads, natural GIL
        run: python .github/scripts/cp315t_text_contract.py
      - name: Actual GTK3 window lifecycle and system plugins
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgtk-3-0t64 dconf-gsettings-backend librsvg2-common
          xvfb-run -a --server-args="-screen 0 640x480x24 -nolisten tcp" python .github/scripts/cp315t_gtk_contract.py --output gtk-contract.json
      - name: Strict typing of delivery backend and new native qualification tools
        run: |
          python -m pip install pyright==1.1.414
          python -m pyright --project .github/pyright-cp315t.json
      - run: python -m pip check
      - name: Keep actual qualification output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp315t-native-${{ runner.os }}
          path: |
            provenance.json
            gtk-contract.json
          if-no-files-found: warn

name: CPython 3.15t ordinary dependency delivery
on:
  push:
    branches: [5.x]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordinary-pip-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.15t
      - name: Linux system SDK profile
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavdevice-dev libjpeg-dev libwebp-dev libpng-dev libtiff-dev libopenjp2-7-dev
      - name: Ordinary pip from default branch
        working-directory: ${{ runner.temp }}
        run: python -m pip install "opencv-python @ git+https://github.com/StableKite/opencv-python.git"
      - name: Actual native text and eight OS threads, natural GIL off
        run: python .github/scripts/cp315t_text_contract.py
      - run: python -m pip check
